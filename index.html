<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evan Albers</title>
<meta name="description" content="Research on artificial life, AI, cellular automata and cybernetics.">
<meta name="color-scheme" content="light dark">
<script>
// Apply a saved theme choice before first paint, so the page never flashes the wrong theme.
try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page" id="page">
  <canvas id="automaton" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="topbar">
      <p class="panel hint">Hover or tap a title</p>
      <div class="controls">
        <p class="panel status"><span id="ca-rule">Rule 30</span> <span class="sep">/</span> <span id="ca-pass">pass 1</span></p>
        <button type="button" class="panel btn" id="ca-toggle">Pause</button>
        <button type="button" class="panel btn" id="theme-toggle">Dark mode</button>
      </div>
    </div>

    <!-- Each .item is one block of grid text. Elements with class "gt" are drawn as cells
         by automaton.js (data-scale sets the size); ".desc" is ordinary text that appears
         when the block's tiles flip. -->
    <header class="item hero">
      <h1 class="gt" data-scale="2">evan albers</h1>
    </header>

    <!-- TODO: every link below points at itself for now. Replace each href with the real
         address: research.html and about.html (or wherever those pages will live), and
         your Google Scholar, Substack and LinkedIn URLs. Fill in the [BRACKETED] text too. -->
    <nav class="index" aria-label="Sections">
      <a class="item" id="research" href="#research">
        <span class="gt" data-scale="1">research</span>
        <span class="desc">Reinforcement Learning, Complex Systems, and Agent-Based Modeling</span>
      </a>
      <a class="item" id="about" href="#about">
        <span class="gt" data-scale="1">about me</span>
        <span class="desc"><span class="placeholder">I am a DPhil student studying computer science at the University of Oxford. More about me here.</span></span>
      </a>
    </nav>

    <nav class="links" aria-label="Elsewhere">
      <a class="item inline" id="google-scholar" href="https://scholar.google.com/citations?user=NBTJeOsAAAAJ&hl=en"><span class="gt" data-font="small" data-underline>google scholar</span></a>
      <a class="item inline" id="substack" href="https://slowlearnings.substack.com/"><span class="gt" data-font="small" data-underline>substack</span></a>
      <a class="item inline" id="linkedin" href="https://www.linkedin.com/in/evan-albers/"><span class="gt" data-font="small" data-underline>linkedin</span></a>
    </nav>
  </div>
</div>
<script src="automaton.js"></script>
</body>
</html>
